<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка размеров VK — Путешествие по Поднебесью</title><style>*{box-sizing:border-box}body{margin:0;background:#132b3b;color:white;font-family:system-ui,sans-serif}header{padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:9px}h1{font-size:17px;margin:0 16px 0 0}button{background:#f4eee0;border:0;border-radius:7px;padding:9px;cursor:pointer}button[aria-pressed=true]{background:#8dd4e6}main{padding:10px;display:flex;justify-content:center}.device{width:390px;max-width:100%;height:780px;max-height:calc(100dvh - 105px);border:4px solid #607785;border-radius:16px;overflow:hidden;background:white}iframe{width:100%;height:100%;border:0}</style></head><body><header><h1>Проверка VK Mini Apps · v0.3.5</h1><button data-width="360" data-height="740">360 × 740</button><button data-width="390" data-height="780" aria-pressed="true">390 × 780</button><button data-width="768" data-height="820">768 × 820</button><button data-width="900" data-height="780">900 × 780</button><button data-width="1200" data-height="800">1200 × 800</button><span id="size" aria-live="polite">390 × 780</span></header><main><div class="device" id="device"><iframe src="./index.html" title="Игра Путешествие по Поднебесью"></iframe></div></main><script>document.querySelectorAll('button[data-width]').forEach(b=>b.onclick=()=>{const d=document.getElementById('device');d.style.width=b.dataset.width+'px';d.style.height=b.dataset.height+'px';document.getElementById('size').textContent=b.dataset.width+' × '+b.dataset.height;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script></body></html>
